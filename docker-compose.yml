secrets:
  govpn_a_key:
    file: ./govpn-a.key
  govpn_b_key:
    file: ./govpn-b.key

configs:
  govpn_a_pub:
    file: ./govpn-a.pub
  govpn_b_pub:
    file: ./govpn-b.pub

services:
  govpn-a:
    build: .
    image: go-vpn
    environment:
      TUN_IP: 10.0.0.1/24
      REMOTE_NET: 10.0.1.0/24
    healthcheck:
      test: ["CMD-SHELL", "ip addr show tun0 | grep -qF $$TUN_IP && ip route | grep -qF $$REMOTE_NET"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    command: ["-peer", "172.30.0.3:9000"]
    networks:
      vpn_net:
        ipv4_address: 172.30.0.2
    secrets:
      - source: govpn_a_key
        target: private_key
    configs:
      - source: govpn_b_pub
        target: /peer_public_key

  govpn-b:
    build: .
    image: go-vpn
    environment:
      TUN_IP: 10.0.1.1/24
      REMOTE_NET: 10.0.0.0/24
    healthcheck:
      test: ["CMD-SHELL", "ip addr show tun0 | grep -qF $$TUN_IP && ip route | grep -qF $$REMOTE_NET"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    command: ["-peer", "172.30.0.2:9000"]
    networks:
      vpn_net:
        ipv4_address: 172.30.0.3
    secrets:
      - source: govpn_b_key
        target: private_key
    configs:
      - source: govpn_a_pub
        target: /peer_public_key

networks:
  vpn_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
