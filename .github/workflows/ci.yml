name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...

  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Fmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "These files are not formatted, run gofmt -w on them:"
            echo "$files"
            exit 1
          fi
      - name: Test
        run: go test ./... -race

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Image
        run: docker build -t govpn:ci .
      - name: Validate Docker Compose
        run: docker compose config -q
      - name: Smoke Test
        run: docker run --rm --entrypoint ./bin/govpn govpn:ci -h
